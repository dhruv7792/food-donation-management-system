
{% extends "base.html" %}
{% load static %}

{% block title %}Donation Details | FoodShare{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="mb-4">
        <a href="{% url 'donor_donation_list' %}"
           class="text-success text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Donations
        </a>
    </div>

    <div id="detailMessage"></div>

    <div id="donationDetails">
        <div class="text-center py-5">
            <div class="spinner-border text-success"></div>
            <p class="text-muted mt-3">Loading donation...</p>
        </div>
    </div>

</div>

{% endblock %}

{% block extra_js %}

<script src="{% static 'js/donation.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const donationId = getDonationIdFromURL();

    console.log("Donation ID from URL:", donationId);

    if (donationId && typeof loadDonationDetail === "function") {
        loadDonationDetail(donationId);
    } else {
        document.getElementById("donationDetails").innerHTML =
            '<div class="alert alert-danger">Invalid donation ID.</div>';
    }

});
</script>

{% endblock %}
