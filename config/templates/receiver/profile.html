{% extends "base.html" %}
{% load static %}

{% block title %}Receiver Profile | FoodShare{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="mb-4">

        <h2 class="fw-bold">
            My Profile
        </h2>

        <p class="text-muted">
            Manage your receiver account information.
        </p>

    </div>


    <div id="profileMessage"></div>


    <div class="row g-4">

        <!-- Profile Card -->

        <div class="col-lg-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body text-center p-4">

                    <div
                        class="rounded-circle bg-success-subtle
                               text-success d-flex align-items-center
                               justify-content-center mx-auto mb-3"
                        style="width:100px;height:100px;font-size:40px;"
                    >
                        <i class="bi bi-person"></i>
                    </div>

                    <h4 class="fw-bold"
                        id="profileName">
                        Receiver
                    </h4>

                    <p class="text-muted"
                       id="profileEmail">
                        —
                    </p>

                    <span class="badge text-bg-primary">
                        Receiver
                    </span>

                </div>

            </div>

        </div>


        <!-- Profile Form -->

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-4">
                        Personal Information
                    </h5>


                    <form id="receiverProfileForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="firstName"
                                    name="first_name"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lastName"
                                    name="last_name"
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    readonly
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    name="phone_no"
                                >

                            </div>


                            <div class="col-12 mb-3">

                                <label class="form-label fw-semibold">
                                    Address
                                </label>

                                <textarea
                                    class="form-control"
                                    id="address"
                                    name="address"
                                    rows="3"
                                ></textarea>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success"
                            id="saveReceiverProfileBtn"
                        >
                            <i class="bi bi-check-lg me-2"></i>
                            Save Changes
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="{% static 'js/receiver-profile.js' %}"></script>
{% endblock %}
